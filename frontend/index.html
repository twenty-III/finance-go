<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased" x-data="app()">
    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <span class="font-bold text-xl">Finance Tracker</span>
                </div>
                <div x-show="user" class="flex items-center gap-4">
                    <span x-text="'Hello, ' + user.username"></span>
                    <button @click="logout" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-semibold transition">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <!-- Error Alert -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" x-text="error"></span>
            <span @click="error = ''" class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer">
                <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
            </span>
        </div>

        <!-- Login / Register View -->
        <div x-show="!user" class="max-w-md mx-auto bg-white p-8 rounded shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-center" x-text="isLogin ? 'Sign In' : 'Create Account'"></h2>
            <form @submit.prevent="submitAuth">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                    <input x-model="authForm.username" type="text" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input x-model="authForm.password" type="password" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition w-full" x-text="isLogin ? 'Login' : 'Register'"></button>
                </div>
                <p class="text-center text-sm text-gray-600 mt-4 cursor-pointer hover:text-indigo-600 transition" @click="isLogin = !isLogin" x-text="isLogin ? 'Need an account? Register' : 'Already have an account? Sign in'"></p>
            </form>
        </div>

        <!-- Dashboard View -->
        <div x-show="user" x-cloak class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Add Expense Form -->
            <div class="col-span-1 bg-white p-6 rounded shadow-md">
                <h3 class="text-xl font-bold mb-4">Add Expense</h3>
                <form @submit.prevent="addExpense">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
                        <input x-model="expenseForm.description" type="text" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Amount ($)</label>
                        <input x-model="expenseForm.amount" type="number" step="0.01" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Date</label>
                        <input x-model="expenseForm.date" type="datetime-local" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition w-full">Save Expense</button>
                </form>
            </div>

            <!-- Expenses List -->
            <div class="col-span-1 md:col-span-2 bg-white p-6 rounded shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Your Expenses</h3>
                    <button @click="fetchExpenses" class="text-indigo-600 hover:text-indigo-800">↻ Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-50 text-gray-600 uppercase text-sm leading-normal border-b">
                            <tr>
                                <th class="py-3 px-6 text-left">Date</th>
                                <th class="py-3 px-6 text-left">Description</th>
                                <th class="py-3 px-6 text-right">Amount</th>
                                <th class="py-3 px-6 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-600 text-sm font-light">
                            <template x-for="exp in expenses" :key="exp.id">
                                <tr class="border-b border-gray-200 hover:bg-gray-50 transition">
                                    <td class="py-3 px-6 text-left whitespace-nowrap" x-text="new Date(exp.date).toLocaleDateString()"></td>
                                    <td class="py-3 px-6 text-left" x-text="exp.description"></td>
                                    <td class="py-3 px-6 text-right font-bold" x-text="'$' + exp.amount.toFixed(2)"></td>
                                    <td class="py-3 px-6 text-center">
                                        <button @click="deleteExpense(exp.id)" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">Delete</button>
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="expenses.length === 0">
                                <td colspan="4" class="py-6 text-center text-gray-500">No expenses found. Add some!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        function app() {
            return {
                user: null,
                isLogin: true,
                error: '',
                authForm: { username: '', password: '' },
                expenseForm: { description: '', amount: '', date: '' },
                expenses: [],

                init() {
                    // Pre-fill date with current local time
                    const now = new Date();
                    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                    this.expenseForm.date = now.toISOString().slice(0, 16);
                },

                async submitAuth() {
                    this.error = '';
                    try {
                        const endpoint = this.isLogin ? '/api/v1/auth/signIn' : '/api/v1/users';
                        const res = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.authForm.username,
                                password: this.authForm.password
                            })
                        });

                        const data = await res.json();
                        
                        if (!res.ok) {
                            throw new Error(data.message || data.error || 'Authentication failed');
                        }

                        this.user = data;
                        this.authForm.password = ''; // clear password
                        this.fetchExpenses();
                    } catch (err) {
                        this.error = err.message;
                    }
                },

                async logout() {
                    this.error = '';
                    try {
                        await fetch('/api/v1/auth/signOut', { method: 'POST' });
                        this.user = null;
                        this.expenses = [];
                    } catch (err) {
                        this.error = 'Failed to logout';
                    }
                },

                async fetchExpenses() {
                    if (!this.user) return;
                    this.error = '';
                    try {
                        // The backend route is /api/v1/users/{userId}/expenses
                        const res = await fetch(`/api/v1/users/${this.user.id}/expenses`);
                        if (!res.ok) throw new Error('Failed to fetch expenses');
                        const data = await res.json();
                        this.expenses = data.expenses || [];
                    } catch (err) {
                        this.error = err.message;
                    }
                },

                async addExpense() {
                    if (!this.user) return;
                    this.error = '';
                    try {
                        const dateIso = new Date(this.expenseForm.date).toISOString();
                        const res = await fetch(`/api/v1/users/${this.user.id}/expenses`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                description: this.expenseForm.description,
                                amount: parseFloat(this.expenseForm.amount),
                                date: dateIso
                            })
                        });
                        
                        if (!res.ok) {
                            const errData = await res.json();
                            throw new Error(errData.message || 'Failed to add expense');
                        }
                        
                        this.expenseForm.description = '';
                        this.expenseForm.amount = '';
                        this.fetchExpenses();
                    } catch (err) {
                        this.error = err.message;
                    }
                },

                async deleteExpense(id) {
                    if (!this.user || !confirm('Are you sure you want to delete this expense?')) return;
                    this.error = '';
                    try {
                        const res = await fetch(`/api/v1/users/${this.user.id}/expenses/${id}`, {
                            method: 'DELETE'
                        });
                        if (!res.ok) throw new Error('Failed to delete expense');
                        this.fetchExpenses();
                    } catch (err) {
                        this.error = err.message;
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</body>
</html>
